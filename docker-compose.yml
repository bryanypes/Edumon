# docker compose up --build
# http://localhost:8080

services:
  edumon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumon-app
    env_file:
      - "Backend/.env"
    environment:
      NODE_ENV: production
    ports:
      - "8080:80"
    volumes:
      - mongo-data:/data/db
      - uploads-data:/data/uploads
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
