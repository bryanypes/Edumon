# docker compose up --build
# http://localhost:8095
#
# Puerto de host 8095 a propósito: 8080 ya está ocupado por otro servicio
# del mismo servidor. Edumon es un servicio Docker aparte, no una subruta
# de otro sitio, así que necesita su propio puerto.

services:
  edumon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumon-app
    env_file:
      - "Backend/.env"
    environment:
      NODE_ENV: production
    ports:
      - "${EDUMON_PORT:-8095}:80"
    volumes:
      - mongo-data:/data/db
      - uploads-data:/data/uploads
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
