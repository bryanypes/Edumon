# docker compose up --build
# http://localhost:8095
#
# Puerto de host 8095 a propósito: 8080 ya lo usa el stack raíz de NOVA_FT
# (docker-compose.yml en la raíz del repo) en el mismo servidor — Edumon es
# un servicio Docker totalmente aparte, no una subruta de nova.uniautonoma.edu.co,
# así que necesita su propio puerto para no chocar.

services:
  edumon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumon-app
    env_file:
      - "Backend/.env"
    environment:
      NODE_ENV: production
    ports:
      - "${EDUMON_PORT:-8095}:80"
    volumes:
      - mongo-data:/data/db
      - uploads-data:/data/uploads
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:
