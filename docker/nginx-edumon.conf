map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# nginx.conf base ya trae "gzip on;" activado, no se repite acá
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml font/woff2 font/woff text/plain;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # la publicación del APK puede llegar a ~200 MB
    client_max_body_size 210m;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # liveness de nginx en si mismo: no dice nada del backend
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # liveness real: si el backend no esta escuchando en :4000 (crasheo al
    # arrancar, por ejemplo), esto da 502 aunque nginx este perfecto -- es lo
    # que usa el HEALTHCHECK del contenedor para no reportar "healthy" con el
    # backend caido (nginx solo, arriba, no lo detecta).
    location = /health/backend {
        access_log off;
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # archivos subidos (fotos, adjuntos, APK) y avatares predeterminados:
    # los sirve el backend (controla el acceso a /uploads/priv/)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
